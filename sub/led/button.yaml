# Кнопка светодиода
#
# Управляемые объекты:
#   - нет
# Требует управляемые объекты:
#   - Кнопка                    (binary_sensor_button)
#   - Переключатель светодиода  (light_led)

substitutions:
  number: 1

binary_sensor:
  # Добавляем поведение кнопке — нажатие кнопки переключает переключатель реле.
  - id: !extend binary_sensor_button_${number}
    on_press:
      - light.toggle:
          id: light_led_${number}
